<div class="container">
  <div class="contact-header">
    <h2>Contact Us</h2>
    <p>Have a question? We'd love to hear from you.</p>
  </div>

  <form class="contact-form" onsubmit="alert('Message Sent!'); return false;">
    <div class="input-group">
      <input type="text" id="name" placeholder=" " required>
      <label for="name">Name</label>

    </div>
    <div class="input-group">
     
      <input type="email" id="email" placeholder=" " required>
        <label for="email">Email</label>
    </div>
    <div class="input-group">
       
      <textarea rows="5" placeholder=" " id="msg" required></textarea>
      <label for="msg">Message</label>
    </div>
    <button type="submit" class="btn-primary btn-contact">Send Message</button>
  </form>
</div>

<footer>© 2026 TaskFlow</footer>
</body>
